name: Contato Seguro Automation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Iniciar ambiente Docker
        run: |
          cd Ambiente
          docker compose up --build -d
          docker compose ps

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Aguardar aplicação
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5400 > /dev/null; then
              echo "Aplicação disponível."
              exit 0
            fi

            echo "Aguardando aplicação... tentativa $i/30"
            sleep 10
          done

          echo "Aplicação não ficou disponível."
          cd Ambiente
          docker compose ps
          docker compose logs
          exit 1

      - name: Executar testes Cypress
        uses: cypress-io/github-action@v5

      - name: Encerrar ambiente Docker
        if: always()
        run: |
          cd Ambiente
          docker compose down
